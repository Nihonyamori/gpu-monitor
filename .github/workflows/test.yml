name: test

on:
  push:
    branches: ["**"]   # tags run this through release.yml / タグは release.yml 経由
  pull_request:
  workflow_call:       # used by release.yml / release.yml から呼ばれる

jobs:
  test:
    # No GPU here: nvidia-smi is faked and the GUI runs on a virtual display.
    # GPU 無し: nvidia-smi は偽物、GUI は仮想ディスプレイ (xvfb) で動かす。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Install with pipx and run the command
        run: |
          pipx install .
          gpu-monitor --version
